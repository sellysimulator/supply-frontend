<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Supply is a curated catalog of educational supply chain games and simulations."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <title>Supply — Supply Chain Games &amp; Simulations</title>
    <script>
      /* Applies the remembered theme before the first paint, so a reader who
         chose dark never sees a white flash while React boots. The key and the
         values match src/theme/context.ts. */
      ;(function () {
        try {
          var stored = localStorage.getItem('supply-theme')
          var dark =
            stored === 'dark' ||
            ((stored === null || stored === 'system') &&
              matchMedia('(prefers-color-scheme: dark)').matches)
          if (dark) document.documentElement.classList.add('dark')
        } catch (error) {
          /* Storage can be blocked; the light theme is a fine default. */
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
